<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Assign Fixed Amount | Ever Crest Finance </title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
    <style>
        :root {
            box-sizing: border-box;
            padding-top: env(safe-area-inset-top, 0px);
            padding-bottom: env(safe-area-inset-bottom, 0px);
            --bg: #f5f7fb;
            --surface: #fff;
            --group: #fbfcfe;
            --ink: #0b2340;
            --soft: #5b6f86;
            --line: #d5dee8;
            --gold: #ffc93c;
            --ok: #12a06b;
            --bad: #d64535;
            --ring: rgba(11, 35, 64, .14);
            --shadow: 0 20px 50px -30px rgba(11, 35, 64, .35)
        }

        *, *::before, *::after { box-sizing: inherit }
        html { height: 100%; -webkit-text-size-adjust: 100%; scroll-padding-top: env(safe-area-inset-top, 0px) }
        body { margin: 0; min-height: 100%; background: var(--bg); color: var(--ink); font: 15px/1.5 "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif }
        [hidden] { display: none !important }

        .top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: rgba(255, 255, 255, .94); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); border-bottom: 1px solid var(--line) }
        .top .in { max-width: 1100px; margin: 0 auto; padding: 10px 18px; display: flex; align-items: center; justify-content: space-between; gap: 12px }
        .brand { font-weight: 800; letter-spacing: -.01em }
        .brand i { font-style: normal; color: #e0a800 }
        .badge-admin { display: inline-block; padding: 3px 10px; border-radius: 999px; background: #fff8e6; border: 1px solid var(--gold); color: #b8860b; font-size: .7rem; font-weight: 800; text-transform: uppercase; letter-spacing: .05em; margin-left: 8px }

        main { max-width: 620px; margin: 0 auto; padding: 22px 18px 44px }
        .back { display: inline-block; margin: 0 0 12px; color: var(--ink); font-weight: 700; text-decoration: none }
        .back:hover { text-decoration: underline }
        h1 { font-size: clamp(1.5rem, 5vw, 2rem); margin: 0 0 2px; letter-spacing: -.02em; font-weight: 800 }
        .sub { color: var(--soft); margin: 0 0 18px; font-size: .9rem }

        .card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 18px 16px; box-shadow: var(--shadow) }

        .user { display: flex; align-items: center; gap: 12px; padding: 12px 14px; background: var(--group); border: 1px solid var(--line); border-radius: 12px; margin-bottom: 16px }
        .avatar { flex: none; width: 42px; height: 42px; border-radius: 50%; background: var(--ink); color: var(--gold); display: grid; place-items: center; font-weight: 800; font-size: .85rem }
        .u-name { font-weight: 800 }
        .u-meta { font-size: .78rem; color: var(--soft); word-break: break-all }

        .current { display: flex; justify-content: space-between; gap: 10px; padding: 12px 14px; border-radius: 10px; background: #fff8e6; border: 1px solid #ffe9a8; font-size: .88rem; margin-bottom: 4px }
        .current span:first-child { color: var(--soft); font-weight: 600 }
        .current span:last-child { font-weight: 800; color: #b8860b }

        label { display: block; font-size: .86rem; font-weight: 600; color: var(--soft); margin: 14px 0 6px }
        input { width: 100%; height: 46px; padding: 0 14px; font: inherit; font-size: 16px; color: var(--ink); background: var(--group); border: 1.5px solid var(--line); border-radius: 8px; outline: 0; appearance: none; -webkit-appearance: none; transition: border-color .2s, box-shadow .2s }
        input:focus { background: #fff; border-color: var(--ink); box-shadow: 0 0 0 4px var(--ring) }
        .money { position: relative }
        .money span { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); font-weight: 700; color: var(--soft) }
        .money input { padding-left: 30px }

        .go { width: 100%; height: 52px; margin-top: 18px; border: 0; border-radius: 999px; background: var(--gold); color: var(--ink); font: inherit; font-size: 1.05rem; font-weight: 800; cursor: pointer; box-shadow: 0 10px 24px -10px rgba(255, 201, 60, .9); transition: transform .15s, filter .2s, opacity .2s }
        .go:hover { filter: brightness(1.05) }
        .go:active { transform: scale(.98) }
        .go:disabled { opacity: .55; cursor: not-allowed; background: #d5dee8; color: #5b6f86; box-shadow: none }
        .rm { width: 100%; height: 46px; margin-top: 10px; border-radius: 999px; border: 1.5px solid var(--bad); background: #fff; color: var(--bad); font: inherit; font-weight: 700; cursor: pointer }
        .rm:disabled { opacity: .5; cursor: not-allowed }

        .snack { position: fixed; top: calc(env(safe-area-inset-top, 0px) + 12px); left: 50%; z-index: 99; width: min(92vw, 460px); padding: 13px 16px; border-radius: 12px; color: #fff; font-weight: 600; font-size: .9rem; background: var(--ink); box-shadow: 0 14px 34px -12px rgba(11, 35, 64, .6); transform: translate(-50%, -160%); opacity: 0; transition: transform .35s cubic-bezier(.2, .8, .2, 1), opacity .3s; pointer-events: none }
        .snack.show { transform: translate(-50%, 0); opacity: 1 }
        .snack.success { background: var(--ok) }
        .snack.error { background: var(--bad) }
        .loading-row { text-align: center; padding: 28px 12px; color: var(--soft); font-size: .88rem }
    </style>
</head>

<body>
    <div class="snack" id="snack" role="status" aria-live="polite"></div>
    <header class="top">
        <div class="in">
            <div class="brand"><i>Ever</i> Crest Finance  <span class="badge-admin">Admin</span></div>
        </div>
    </header>

    <main>
        <a class="back" href="pre-list-all-users.html">&larr; Back</a>
        <h1>Assign Fixed Amount</h1>
        <p class="sub">This is the amount the user will see (and can't edit) on their withdrawal page.</p>

        <div class="card">
            <div class="loading-row" id="loading">Loading user…</div>

            <div id="content" hidden>
                <div class="user">
                    <div class="avatar" id="uAvatar">?</div>
                    <div style="min-width:0">
                        <div class="u-name" id="uName"></div>
                        <div class="u-meta" id="uMeta"></div>
                    </div>
                </div>

                <div class="current"><span>Current fixed amount</span><span id="curAmt">Not added yet</span></div>

                <form id="f" novalidate>
                    <label for="amount">Fixed Withdrawal Amount (USD)</label>
                    <div class="money"><span aria-hidden="true">$</span>
                        <input id="amount" type="number" min="1" step="0.01" inputmode="decimal"
                            placeholder="40000.00" required>
                    </div>
                    <button class="go" id="go" type="submit">Save Fixed Amount</button>
                    <button class="rm" id="rm" type="button" hidden>Remove Fixed Amount</button>
                </form>
            </div>
        </div>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
        import { getAuth } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
        import { getDatabase, ref, get, update } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBH0n84QTvGBWaSlJdO6AoUU6IRuJETHLA",
            authDomain: "ever-crest-finance-bank.firebaseapp.com",
            projectId: "ever-crest-finance-bank",
            storageBucket: "ever-crest-finance-bank.firebasestorage.app",
            messagingSenderId: "469287844559",
            appId: "1:469287844559:web:4f219675a1055533be95ba"
        };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);

        const $ = i => document.getElementById(i);
        const fullName = u => [u && u.firstName, u && u.lastName].filter(Boolean).join(' ').trim() || 'Unnamed user';
        const initials = u => (((u && u.firstName || '?')[0]) + ((u && u.lastName || '')[0] || '')).toUpperCase();
        const money = n => { try { return new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD' }).format(Number(n) || 0); } catch (_) { return '$' + (Number(n) || 0).toFixed(2); } };
        const round2 = n => Math.round(n * 100) / 100;

        let snackTimer;
        function toast(msg, type = 'info', ms = 4500) {
            const s = $('snack');
            s.textContent = msg; s.className = 'snack ' + type;
            void s.offsetWidth; s.classList.add('show');
            clearTimeout(snackTimer);
            snackTimer = setTimeout(() => s.classList.remove('show'), ms);
        }

        const uid = new URLSearchParams(location.search).get('uid');

        function showCurrent(v) {
            const has = v !== undefined && v !== null && v !== '' && Number(v) > 0;
            $('curAmt').textContent = has ? money(v) : 'Not added yet';
            $('rm').hidden = !has;
            $('amount').value = has ? Number(v) : '';
        }

        $('f').addEventListener('submit', async e => {
            e.preventDefault();
            const amount = round2(Number($('amount').value));
            if (!Number.isFinite(amount) || amount < 1) { $('amount').focus(); return toast('Enter a valid amount of at least $1.', 'error'); }
            $('go').disabled = true; $('go').textContent = 'Saving…';
            try {
                await update(ref(db, 'users/' + uid), {
                    fixedWithdrawalAmount: amount,
                    fixedWithdrawalUpdatedAt: Date.now()
                });
                showCurrent(amount);
                toast('Fixed amount saved.', 'success');
            } catch (err) {
                console.error(err);
                toast('Could not save: ' + (err.message || 'unknown error'), 'error', 8000);
            } finally {
                $('go').disabled = false; $('go').textContent = 'Save Fixed Amount';
            }
        });

        $('rm').addEventListener('click', async () => {
            if (!confirm('Remove the fixed amount for this user?')) return;
            $('rm').disabled = true;
            try {
                await update(ref(db, 'users/' + uid), { fixedWithdrawalAmount: null, fixedWithdrawalUpdatedAt: null });
                showCurrent(null);
                toast('Fixed amount removed.', 'success');
            } catch (err) {
                toast('Could not remove: ' + (err.message || 'unknown error'), 'error', 8000);
            } finally { $('rm').disabled = false; }
        });

        (async () => {
            await auth.authStateReady();
            if (!auth.currentUser) { location.replace('login.html'); return; }
            if (!uid) { location.replace('pre-list-all-users.html'); return; }
            try {
                const snap = await get(ref(db, 'users/' + uid));
                if (!snap.exists()) { $('loading').textContent = 'User not found.'; return; }
                const p = snap.val() || {};
                $('uAvatar').textContent = initials(p);
                $('uName').textContent = fullName(p);
                $('uMeta').textContent = p.email || uid;
                showCurrent(p.fixedWithdrawalAmount);
                $('loading').hidden = true;
                $('content').hidden = false;
            } catch (err) {
                $('loading').textContent = 'Could not load user: ' + err.message;
            }
        })();
    </script>
</body>

</html>
