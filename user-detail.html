<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Withdrawal Request | Ever Crest Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
    <style>
        :root {
            box-sizing: border-box;
            padding-top: env(safe-area-inset-top, 0px);
            padding-bottom: env(safe-area-inset-bottom, 0px);
            --bg: #f5f7fb;
            --surface: #fff;
            --group: #fbfcfe;
            --ink: #0b2340;
            --soft: #5b6f86;
            --line: #d5dee8;
            --gold: #ffc93c;
            --ok: #12a06b;
            --bad: #d64535;
            --shadow: 0 20px 50px -30px rgba(11, 35, 64, .35)
        }

        *,
        *::before,
        *::after {
            box-sizing: inherit
        }

        body {
            margin: 0;
            min-height: 100%;
            background: var(--bg);
            color: var(--ink);
            font: 15px/1.5 "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif
        }

        [hidden] {
            display: none !important
        }

        .top {
            position: sticky;
            top: env(safe-area-inset-top, 0px);
            z-index: 20;
            background: rgba(255, 255, 255, .94);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border-bottom: 1px solid var(--line)
        }

        .top .in {
            max-width: 1180px;
            margin: 0 auto;
            padding: 10px 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px
        }

        .brand {
            font-weight: 800;
            letter-spacing: -.01em
        }

        .brand i {
            font-style: normal;
            color: #e0a800
        }

        .badge-admin {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 999px;
            background: #fff8e6;
            border: 1px solid var(--gold);
            color: #b8860b;
            font-size: .7rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: .05em;
            margin-left: 8px
        }

        .av {
            text-decoration: none;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: var(--ink);
            color: var(--gold);
            display: grid;
            place-items: center;
            font-weight: 800;
            font-size: .82rem
        }

        main {
            max-width: 1180px;
            margin: 0 auto;
            padding: 22px 18px 60px
        }

        h1 {
            font-size: clamp(1.5rem, 4vw, 1.9rem);
            margin: 0 0 2px;
            letter-spacing: -.02em;
            font-weight: 800
        }

        .sub {
            color: var(--soft);
            margin: 0 0 18px;
            font-size: .9rem
        }

        .back-link {
            display: inline-block;
            margin-bottom: 12px;
            color: var(--ink);
            font-weight: 700;
            text-decoration: none;
            font-size: .88rem
        }

        .back-link:hover {
            text-decoration: underline
        }

        .panel {
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: 16px;
            padding: 18px 16px;
            box-shadow: var(--shadow);
            margin-bottom: 18px
        }

        .panel-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 14px;
            flex-wrap: wrap
        }

        .panel-head h2 {
            margin: 0;
            font-size: 1.05rem;
            font-weight: 800
        }

        .rows {
            text-align: left;
            border-top: 1px dashed var(--line);
            margin-top: 6px
        }

        .row {
            display: flex;
            justify-content: space-between;
            gap: 14px;
            padding: 10px 0;
            border-bottom: 1px dashed var(--line);
            font-size: .88rem
        }

        .row span:first-child {
            color: var(--soft);
            flex: none
        }

        .row span:last-child {
            font-weight: 700;
            text-align: right;
            word-break: break-all
        }

        .pill {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 999px;
            font-size: .72rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: .04em
        }

        .pill.pending {
            background: #fff8e6;
            color: #b8860b
        }

        .pill.approved {
            background: #e3f6ee;
            color: #0b6b47
        }

        .pill.processing {
            background: #e0f2fe;
            color: #0369a1
        }

        .pill.failed {
            background: #fbe7e4;
            color: #a3291c
        }

        .btn-row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 16px
        }

        .btn-lg {
            height: 46px;
            padding: 0 22px;
            border-radius: 999px;
            border: 1.5px solid var(--ink);
            background: #fff;
            color: var(--ink);
            font: inherit;
            font-weight: 800;
            font-size: .9rem;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: filter .2s
        }

        .btn-lg:hover {
            filter: brightness(.97)
        }

        .btn-lg.ok {
            background: var(--ok);
            border-color: var(--ok);
            color: #fff
        }

        .btn-lg.gold {
            background: var(--gold);
            border-color: var(--gold);
            color: var(--ink)
        }

        .btn-lg:disabled {
            opacity: .5;
            cursor: not-allowed
        }

        .empty {
            text-align: center;
            padding: 28px 12px;
            color: var(--soft);
            font-size: .88rem
        }

        .loading-row {
            padding: 24px;
            text-align: center;
            color: var(--soft);
            font-size: .88rem
        }

        .snack {
            position: fixed;
            top: calc(env(safe-area-inset-top, 0px) + 12px);
            left: 50%;
            z-index: 99;
            width: min(92vw, 460px);
            padding: 13px 16px;
            border-radius: 12px;
            color: #fff;
            font-weight: 600;
            font-size: .9rem;
            background: var(--ink);
            box-shadow: 0 14px 34px -12px rgba(11, 35, 64, .6);
            transform: translate(-50%, -160%);
            opacity: 0;
            transition: transform .35s cubic-bezier(.2, .8, .2, 1), opacity .3s;
            pointer-events: none
        }

        .snack.show {
            transform: translate(-50%, 0);
            opacity: 1
        }

        .snack.success {
            background: var(--ok)
        }

        .snack.error {
            background: var(--bad)
        }
    </style>
</head>

<body>
    <div class="snack" id="snack"></div>
    <header class="top">
        <div class="in">
            <div class="brand"><i>Ever</i> Crest Finance  <span class="badge-admin">Admin</span></div>
            <a class="av" id="avatar" href="admin.html">AD</a>
        </div>
    </header>
    <main>
        <a class="back-link" id="backLink" href="users.html">&larr; Back to User</a>
        <h1>Withdrawal Request</h1>
        <p class="sub" id="reqDetailSub">Loading…</p>

        <div class="panel">
            <div class="panel-head">
                <h2>Status</h2><span class="pill" id="reqStatusPill">—</span>
            </div>
            <div class="rows" id="reqRows">
                <div class="loading-row">Loading…</div>
            </div>
            <div class="btn-row">
                <button class="btn-lg ok" id="approveBtn">Approve Request</button>
                <button class="btn-lg gold" id="activateClearanceBtn" hidden>Activate Clearance Form for this
                    user</button>
                <a class="btn-lg" id="backToUserBtn" href="users.html">Back to User</a>
            </div>
        </div>
    </main>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
        import { getAuth } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
        import { getDatabase, ref, get, update, push, set } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBH0n84QTvGBWaSlJdO6AoUU6IRuJETHLA",
            authDomain: "ever-crest-finance-bank.firebaseapp.com",
            projectId: "ever-crest-finance-bank",
            storageBucket: "ever-crest-finance-bank.firebasestorage.app",
            messagingSenderId: "469287844559",
            appId: "1:469287844559:web:4f219675a1055533be95ba"
        };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);
        const $ = i => document.getElementById(i);
        const LOCALE = { NGN: 'en-NG', USD: 'en-US', GBP: 'en-GB', EUR: 'en-IE', GHS: 'en-GH', KES: 'en-KE', ZAR: 'en-ZA' };
        const money = (n, c = 'USD') => { try { return new Intl.NumberFormat(LOCALE[c] || 'en', { style: 'currency', currency: c }).format(Number(n) || 0); } catch (_) { return c + ' ' + (Number(n) || 0).toFixed(2); } };
        const fmtDate = t => t ? new Date(Number(t)).toLocaleString('en-GB', { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' }) : '—';
        const fullName = u => [u && u.firstName, u && u.lastName].filter(Boolean).join(' ').trim() || 'Unnamed user';
        const initials = u => (((u && u.firstName || '?')[0]) + ((u && u.lastName || '')[0] || '')).toUpperCase();
        const statusPill = (status) => {
            const s = String(status || 'pending').toLowerCase();
            const cls = (s === 'approved' || s === 'completed' || s === 'successful') ? 'approved' : (s === 'processing') ? 'processing' : (s === 'failed') ? 'failed' : 'pending';
            const label = cls === 'approved' ? 'Approved' : cls === 'processing' ? 'Processing' : cls === 'failed' ? 'Failed' : 'Pending';
            return { cls, label };
        };
        let snackTimer;
        function toast(msg, type = 'info', ms = 5000) {
            const s = $('snack');
            s.textContent = msg; s.className = 'snack ' + type;
            void s.offsetWidth; s.classList.add('show');
            clearTimeout(snackTimer); snackTimer = setTimeout(() => s.classList.remove('show'), ms);
        }

        const uid = new URLSearchParams(location.search).get('uid');
        const refNo = new URLSearchParams(location.search).get('ref');
        if (!uid || !refNo) location.replace('users.html');

        let currentUser = null, currentTx = null;

        (async () => {
            await auth.authStateReady();
            const user = auth.currentUser;
            if (!user) { location.replace('login.html'); return; }
            const adminSnap = await get(ref(db, 'users/' + user.uid));
            const adminProf = adminSnap.exists() ? adminSnap.val() : {};
            $('avatar').textContent = initials(adminProf) || 'AD';

            $('backLink').href = `user-detail.html?uid=${encodeURIComponent(uid)}`;
            $('backToUserBtn').href = `user-detail.html?uid=${encodeURIComponent(uid)}`;

            const [uSnap, txSnap] = await Promise.all([
                get(ref(db, 'users/' + uid)),
                get(ref(db, 'transactions/' + uid + '/' + refNo))
            ]);
            if (!uSnap.exists() || !txSnap.exists()) {
                $('reqDetailSub').textContent = 'Request not found.';
                $('reqRows').innerHTML = '<div class="empty">Not found.</div>';
                return;
            }
            currentUser = uSnap.val();
            currentTx = txSnap.val();

            $('reqDetailSub').textContent = `${fullName(currentUser)} • ${currentTx.reference || refNo}`;
            const { cls, label } = statusPill(currentTx.status);
            const pill = $('reqStatusPill');
            pill.className = 'pill ' + cls;
            pill.textContent = label;

            const rows = $('reqRows');
            rows.innerHTML = '';
            [
                ['User', fullName(currentUser)],
                ['Email', currentUser.email || '—'],
                ['UID', uid],
                ['Type', currentTx.type || 'withdrawal'],
                ['Source', currentTx.asset || '—'],
                ['Amount', money(currentTx.amount, currentTx.currency || 'USD')],
                ['Currency', currentTx.currency || 'USD'],
                ['Percent', (currentTx.assetPercent || 10) + '%'],
                ['Deposit Required', money(currentTx.depositAmount, currentTx.currency || 'USD')],
                ['Reference', currentTx.reference || refNo],
                ['Created', fmtDate(currentTx.createdAt)],
                ['Balance After', money(currentTx.balanceAfterWithdrawal, currentTx.currency || 'USD')],
                ['Status', label]
            ].forEach(([k, v]) => {
                const row = document.createElement('div');
                row.className = 'row';
                row.innerHTML = `<span>${k}</span><span>${v}</span>`;
                rows.appendChild(row);
            });

            const alreadyApproved = cls === 'approved';
            $('approveBtn').disabled = alreadyApproved;
            $('approveBtn').textContent = alreadyApproved ? 'Already Approved' : 'Approve Request';

            const clearanceActivated = !!currentUser.clearanceActivated;
            const ac = $('activateClearanceBtn');
            if (alreadyApproved && !clearanceActivated) {
                ac.hidden = false; ac.disabled = false;
                ac.textContent = 'Activate Clearance Form for this user';
            } else if (alreadyApproved && clearanceActivated) {
                ac.hidden = false; ac.disabled = true;
                ac.textContent = 'Clearance Form Already Activated';
            } else ac.hidden = true;
        })();

        $('approveBtn').addEventListener('click', async () => {
            if (!currentUser || !currentTx) return;
            const btn = $('approveBtn');
            btn.disabled = true; btn.textContent = 'Approving…';
            try {
                const now = Date.now();
                await update(ref(db, 'transactions/' + uid + '/' + refNo), {
                    status: 'approved', approvedAt: now,
                    approvedBy: auth.currentUser ? auth.currentUser.uid : 'admin'
                });
                const notifRef = push(ref(db, 'notifications/' + uid));
                await set(notifRef, {
                    title: 'Withdrawal Approved',
                    message: 'Your withdrawal request of ' + money(currentTx.amount, currentTx.currency || 'USD') +
                        ' (Ref: ' + (currentTx.reference || refNo) + ') has been granted successfully.',
                    createdAt: now, read: false, type: 'withdrawal_approved',
                    reference: currentTx.reference || refNo, amount: currentTx.amount
                });
                currentTx.status = 'approved';
                const { cls, label } = statusPill('approved');
                const pill = $('reqStatusPill');
                pill.className = 'pill ' + cls; pill.textContent = label;
                btn.textContent = 'Already Approved'; btn.disabled = true;
                const ac = $('activateClearanceBtn');
                if (!currentUser.clearanceActivated) {
                    ac.hidden = false; ac.disabled = false;
                    ac.textContent = 'Activate Clearance Form for this user';
                }
                toast('Request approved and user notified.', 'success', 6000);
            } catch (e) {
                console.error(e);
                btn.disabled = false; btn.textContent = 'Approve Request';
                toast('Could not approve. ' + (e?.message || ''), 'error', 8000);
            }
        });

        $('activateClearanceBtn').addEventListener('click', async () => {
            if (!currentUser) return;
            const btn = $('activateClearanceBtn');
            btn.disabled = true; btn.textContent = 'Activating…';
            try {
                const now = Date.now();
                const clearanceRef = push(ref(db, 'clearance_form/' + uid));
                await set(clearanceRef, {
                    activatedBy: auth.currentUser ? auth.currentUser.uid : 'admin',
                    activatedAt: now, status: 'active', userUid: uid,
                    userEmail: currentUser.email || '', userName: fullName(currentUser),
                    source: 'admin_approval', requestRef: refNo
                });
                await update(ref(db, 'users/' + uid), {
                    clearanceActivated: true, clearanceActivatedAt: now
                });
                const notifRef = push(ref(db, 'notifications/' + uid));
                await set(notifRef, {
                    title: 'Clearance Form Required',
                    message: 'Your payment has been approved. Please fill the clearance form to proceed.',
                    createdAt: now, read: false, type: 'clearance_required',
                    link: 'clearanceform.html'
                });
                currentUser.clearanceActivated = true;
                btn.textContent = 'Clearance Form Activated ✓';
                btn.disabled = true;
                toast('Clearance form activated.', 'success', 6000);
            } catch (e) {
                console.error(e);
                btn.disabled = false; btn.textContent = 'Activate Clearance Form for this user';
                toast('Could not activate. ' + (e?.message || ''), 'error', 8000);
            }
        });
    </script>
</body>

</html>
