<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Apply for a loan | Ever Crest Finance Bank</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="pages.css">
</head>

<body>
    <header class="top">
        <div><a href="dashboard.html" aria-label="Back to dashboard">&larr; Back</a><b>Ever Crest Finance Bank</b></div>
    </header>
    <main>
        <h1>Apply for a loan</h1>
        <p class="sub">Tell us how much you need and for how long.</p>
        <div class="card">
            <form id="f" data-type="loan">
                <label for="amount">Amount</label><input id="amount" name="amount" type="number" min="1" step="0.01"
                    inputmode="decimal" required>
                <label for="term">Duration</label><select id="term" name="months">
                    <option value="3">3 months</option>
                    <option value="6">6 months</option>
                    <option value="12">12 months</option>
                    <option value="24">24 months</option>
                </select>
                <label for="why">Purpose</label><input id="why" name="purpose" required>
                <button class="go" type="submit">Apply now</button>
                <div class="msg" id="msg" role="status" hidden></div>
            </form>
        </div>
        <p class="note">Requests are reviewed before your balance changes.</p>
    </main>
    <script type="module" src="action.js"></script>
</body>

</html>
