<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Withdrawal Fixed Amount | Ever Crest Finance </title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
    <style>
        :root {
            box-sizing: border-box;
            padding-top: env(safe-area-inset-top, 0px);
            padding-bottom: env(safe-area-inset-bottom, 0px);
            --bg: #f5f7fb;
            --surface: #fff;
            --group: #fbfcfe;
            --ink: #0b2340;
            --soft: #5b6f86;
            --line: #d5dee8;
            --gold: #ffc93c;
            --ok: #12a06b;
            --bad: #d64535;
            --ring: rgba(11, 35, 64, .14);
            --shadow: 0 20px 50px -30px rgba(11, 35, 64, .35)
        }

        *, *::before, *::after { box-sizing: inherit }
        html { height: 100%; -webkit-text-size-adjust: 100%; scroll-padding-top: env(safe-area-inset-top, 0px) }
        body { margin: 0; min-height: 100%; background: var(--bg); color: var(--ink); font: 15px/1.5 "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif }
        [hidden] { display: none !important }

        .top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: rgba(255, 255, 255, .94); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); border-bottom: 1px solid var(--line) }
        .top .in { max-width: 1100px; margin: 0 auto; padding: 10px 18px; display: flex; align-items: center; justify-content: space-between; gap: 12px }
        .brand { font-weight: 800; letter-spacing: -.01em }
        .brand i { font-style: normal; color: #e0a800 }
        .badge-admin { display: inline-block; padding: 3px 10px; border-radius: 999px; background: #fff8e6; border: 1px solid var(--gold); color: #b8860b; font-size: .7rem; font-weight: 800; text-transform: uppercase; letter-spacing: .05em; margin-left: 8px }

        main { max-width: 760px; margin: 0 auto; padding: 22px 18px 60px }
        .back { display: inline-block; margin: 0 0 12px; color: var(--ink); font-weight: 700; text-decoration: none }
        .back:hover { text-decoration: underline }
        h1 { font-size: clamp(1.5rem, 4vw, 1.9rem); margin: 0 0 2px; letter-spacing: -.02em; font-weight: 800 }
        .sub { color: var(--soft); margin: 0 0 18px; font-size: .9rem }

        .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 18px 16px; box-shadow: var(--shadow) }

        .search { width: 100%; height: 46px; padding: 0 14px; font: inherit; font-size: 16px; color: var(--ink); background: var(--group); border: 1.5px solid var(--line); border-radius: 8px; outline: 0; margin-bottom: 14px; transition: border-color .2s, box-shadow .2s }
        .search:focus { background: #fff; border-color: var(--ink); box-shadow: 0 0 0 4px var(--ring) }

        .list { display: flex; flex-direction: column; gap: 8px }
        .list-item { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 14px; background: var(--group); border: 1px solid var(--line); border-radius: 12px; text-decoration: none; color: inherit; width: 100%; transition: border-color .2s, background .2s }
        .list-item:hover { border-color: var(--ink); background: #fff }
        .li-left { display: flex; align-items: center; gap: 12px; min-width: 0; flex: 1 }
        .avatar { flex: none; width: 38px; height: 38px; border-radius: 50%; background: var(--ink); color: var(--gold); display: grid; place-items: center; font-weight: 800; font-size: .82rem }
        .li-name { font-weight: 700; font-size: .92rem; word-break: break-word }
        .li-meta { font-size: .78rem; color: var(--soft); word-break: break-all }
        .li-right { flex: none; text-align: right }
        .amt { font-weight: 800; font-size: .95rem; color: #0b6b47 }
        .amt.none { color: var(--soft); font-weight: 600; font-size: .8rem; font-style: italic }
        .chev { color: var(--soft); font-size: .75rem }

        .empty, .loading-row { text-align: center; padding: 28px 12px; color: var(--soft); font-size: .88rem }
    </style>
</head>

<body>
    <header class="top">
        <div class="in">
            <div class="brand"><i>Ever</i> Crest Finance  <span class="badge-admin">Admin</span></div>
        </div>
    </header>

    <main>
        <a class="back" href="admin.html">&larr; Back</a>
        <h1>Withdrawal Fixed Amount</h1>
        <p class="sub">Select a user to assign the fixed amount they can withdraw.</p>

        <div class="panel">
            <input class="search" id="search" type="search" placeholder="Search by name or email…" autocomplete="off">
            <div id="listWrap">
                <div class="loading-row">Loading users…</div>
            </div>
        </div>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
        import { getAuth } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
        import { getDatabase, ref, get, onValue } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBH0n84QTvGBWaSlJdO6AoUU6IRuJETHLA",
            authDomain: "ever-crest-finance-bank.firebaseapp.com",
            projectId: "ever-crest-finance-bank",
            storageBucket: "ever-crest-finance-bank.firebasestorage.app",
            messagingSenderId: "469287844559",
            appId: "1:469287844559:web:4f219675a1055533be95ba"
        };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);

        const $ = i => document.getElementById(i);
        const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        const fullName = u => [u && u.firstName, u && u.lastName].filter(Boolean).join(' ').trim() || 'Unnamed user';
        const initials = u => (((u && u.firstName || '?')[0]) + ((u && u.lastName || '')[0] || '')).toUpperCase();
        const money = n => { try { return new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD' }).format(Number(n) || 0); } catch (_) { return '$' + (Number(n) || 0).toFixed(2); } };

        let users = [];

        function render() {
            const q = $('search').value.trim().toLowerCase();
            const rows = users.filter(u => !q || (fullName(u.profile) + ' ' + (u.profile.email || '')).toLowerCase().includes(q));
            const wrap = $('listWrap');
            if (!rows.length) { wrap.innerHTML = '<div class="empty">No users found.</div>'; return; }
            wrap.innerHTML = '';
            const list = document.createElement('div');
            list.className = 'list';
            rows.forEach(u => {
                const raw = u.profile.fixedWithdrawalAmount;
                const has = raw !== undefined && raw !== null && raw !== '' && Number(raw) > 0;
                const a = document.createElement('a');
                a.className = 'list-item';
                a.href = 'assign-fixed-amount.html?uid=' + encodeURIComponent(u.uid);
                a.innerHTML = `
                    <div class="li-left">
                        <div class="avatar">${esc(initials(u.profile))}</div>
                        <div style="min-width:0">
                            <div class="li-name">${esc(fullName(u.profile))}</div>
                            <div class="li-meta">${esc(u.profile.email || u.uid)}</div>
                        </div>
                    </div>
                    <div class="li-right">
                        <div class="amt ${has ? '' : 'none'}">${has ? money(raw) : 'Not added yet'}</div>
                        <div class="chev">Tap to ${has ? 'update' : 'assign'} &rsaquo;</div>
                    </div>`;
                list.appendChild(a);
            });
            wrap.appendChild(list);
        }

        $('search').addEventListener('input', render);

        (async () => {
            await auth.authStateReady();
            if (!auth.currentUser) { location.replace('login.html'); return; }
          onValue(ref(db, 'users'), snap => {
    const arr = [];
    snap.forEach(child => {
        arr.push({ uid: child.key, profile: child.val() || {} });
    });
    arr.sort((a, b) => fullName(a.profile).localeCompare(fullName(b.profile)));
    users = arr;
    render();
}, err => {
    $('listWrap').innerHTML = '<div class="empty">Could not load users: ' + esc(err.message) + '</div>';
});
        })();
    </script>
</body>

</html>
