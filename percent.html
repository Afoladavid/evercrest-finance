<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Update Percent | Ever Crest Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
    <style>
        :root {
            box-sizing: border-box;
            padding-top: env(safe-area-inset-top, 0px);
            padding-bottom: env(safe-area-inset-bottom, 0px);
            --bg: #f5f7fb;
            --surface: #fff;
            --group: #fbfcfe;
            --ink: #0b2340;
            --soft: #5b6f86;
            --line: #d5dee8;
            --gold: #ffc93c;
            --ok: #12a06b;
            --bad: #d64535;
            --ring: rgba(11, 35, 64, .14);
            --shadow: 0 20px 50px -30px rgba(11, 35, 64, .35)
        }

        *,
        *::before,
        *::after {
            box-sizing: inherit
        }

        body {
            margin: 0;
            min-height: 100%;
            background: var(--bg);
            color: var(--ink);
            font: 15px/1.5 "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif
        }

        [hidden] {
            display: none !important
        }

        .top {
            position: sticky;
            top: env(safe-area-inset-top, 0px);
            z-index: 20;
            background: rgba(255, 255, 255, .94);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border-bottom: 1px solid var(--line)
        }

        .top .in {
            max-width: 1180px;
            margin: 0 auto;
            padding: 10px 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px
        }

        .brand {
            font-weight: 800;
            letter-spacing: -.01em
        }

        .brand i {
            font-style: normal;
            color: #e0a800
        }

        .badge-admin {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 999px;
            background: #fff8e6;
            border: 1px solid var(--gold);
            color: #b8860b;
            font-size: .7rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: .05em;
            margin-left: 8px
        }

        .av {
            text-decoration: none;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: var(--ink);
            color: var(--gold);
            display: grid;
            place-items: center;
            font-weight: 800;
            font-size: .82rem
        }

        main {
            max-width: 1180px;
            margin: 0 auto;
            padding: 22px 18px 60px
        }

        h1 {
            font-size: clamp(1.5rem, 4vw, 1.9rem);
            margin: 0 0 2px;
            letter-spacing: -.02em;
            font-weight: 800
        }

        .sub {
            color: var(--soft);
            margin: 0 0 18px;
            font-size: .9rem
        }

        .back-link {
            display: inline-block;
            margin-bottom: 12px;
            color: var(--ink);
            font-weight: 700;
            text-decoration: none;
            font-size: .88rem
        }

        .back-link:hover {
            text-decoration: underline
        }

        .panel {
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: 16px;
            padding: 18px 16px;
            box-shadow: var(--shadow);
            margin-bottom: 18px
        }

        .panel-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 14px;
            flex-wrap: wrap
        }

        .panel-head h2 {
            margin: 0;
            font-size: 1.05rem;
            font-weight: 800
        }

        .list {
            display: flex;
            flex-direction: column;
            gap: 8px
        }

        .list-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 12px 14px;
            background: var(--group);
            border: 1px solid var(--line);
            border-radius: 12px;
            cursor: pointer;
            text-decoration: none;
            color: inherit;
            width: 100%
        }

        .list-item:hover {
            border-color: var(--ink);
            background: #fff
        }

        .li-left {
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 0;
            flex: 1
        }

        .avatar {
            flex: none;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: var(--ink);
            color: var(--gold);
            display: grid;
            place-items: center;
            font-weight: 800;
            font-size: .82rem
        }

        .li-name {
            font-weight: 700;
            font-size: .92rem;
            word-break: break-word
        }

        .li-meta {
            font-size: .78rem;
            color: var(--soft);
            word-break: break-all
        }

        .li-right {
            flex: none;
            display: flex;
            align-items: center;
            gap: 8px
        }

        .pill {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 999px;
            font-size: .72rem;
            font-weight: 800;
            text-transform: uppercase;
            background: #fff8e6;
            color: #b8860b
        }

        form label {
            display: block;
            font-size: .86rem;
            font-weight: 600;
            color: var(--soft);
            margin: 14px 0 6px
        }

        input,
        select {
            width: 100%;
            height: 46px;
            padding: 0 14px;
            font: inherit;
            font-size: 16px;
            color: var(--ink);
            background: var(--group);
            border: 1.5px solid var(--line);
            border-radius: 8px;
            outline: 0
        }

        input[type="date"] {
            appearance: none;
            -webkit-appearance: none;
            min-height: 46px
        }

        input:focus,
        select:focus {
            background: #fff;
            border-color: var(--ink);
            box-shadow: 0 0 0 4px var(--ring)
        }

        .btn-mini {
            height: 34px;
            padding: 0 14px;
            border-radius: 999px;
            border: 1.5px solid var(--ink);
            background: #fff;
            color: var(--ink);
            font: inherit;
            font-weight: 700;
            font-size: .82rem;
            cursor: pointer
        }

        .btn-row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 16px
        }

        .btn-lg {
            height: 46px;
            padding: 0 22px;
            border-radius: 999px;
            border: 1.5px solid var(--gold);
            background: var(--gold);
            color: var(--ink);
            font: inherit;
            font-weight: 800;
            font-size: .9rem;
            cursor: pointer
        }

        .btn-lg:disabled {
            opacity: .6;
            cursor: not-allowed
        }

        .hint {
            font-size: .78rem;
            color: var(--soft);
            margin-top: 6px
        }

        .field-error {
            color: var(--bad);
            font-size: .78rem;
            margin-top: 4px
        }

        .empty {
            text-align: center;
            padding: 28px 12px;
            color: var(--soft);
            font-size: .88rem
        }

        .loading-row {
            padding: 24px;
            text-align: center;
            color: var(--soft);
            font-size: .88rem
        }

        .snack {
            position: fixed;
            top: calc(env(safe-area-inset-top, 0px) + 12px);
            left: 50%;
            z-index: 99;
            width: min(92vw, 460px);
            padding: 13px 16px;
            border-radius: 12px;
            color: #fff;
            font-weight: 600;
            font-size: .9rem;
            background: var(--ink);
            box-shadow: 0 14px 34px -12px rgba(11, 35, 64, .6);
            transform: translate(-50%, -160%);
            opacity: 0;
            transition: transform .35s cubic-bezier(.2, .8, .2, 1), opacity .3s;
            pointer-events: none
        }

        .snack.show {
            transform: translate(-50%, 0);
            opacity: 1
        }

        .snack.success {
            background: var(--ok)
        }

        .snack.error {
            background: var(--bad)
        }
    </style>
</head>

<body>
    <div class="snack" id="snack"></div>
    <header class="top">
        <div class="in">
            <div class="brand"><i>Ever</i> Crest Finance  <span class="badge-admin">Admin</span></div>
            <a class="av" id="avatar" href="admin.html">AD</a>
        </div>
    </header>
    <main>
        <a class="back-link" href="admin.html">&larr; Back to Dashboard</a>
        <h1>Update User Percent</h1>
        <p class="sub">Choose a user, then set their asset percent and investment policies date.</p>

        <div class="panel" id="step1">
            <div class="panel-head">
                <h2>Select User</h2>
            </div>
            <div id="usersList" class="list">
                <div class="loading-row">Loading users…</div>
            </div>
        </div>

        <div class="panel" id="step2" hidden>
            <div class="panel-head">
                <h2 id="userTitle">—</h2>
                <button class="btn-mini" id="changeUser" type="button">Change User</button>
            </div>
            <form id="percentForm" novalidate>
                <label for="percentSelect">Choose Percent</label>
                <select id="percentSelect">
                    <option value="2">2%</option>
                    <option value="5">5%</option>
                    <option value="10">10%</option>
                    <option value="25">25%</option>
                    <option value="50">50%</option>
                    <option value="100">100%</option>
                    <option value="custom">Custom…</option>
                </select>
                <div id="percentCustomWrap" hidden>
                    <label for="percentCustom">Custom Percent (%)</label>
                    <input id="percentCustom" type="number" min="0" max="100" step="1" inputmode="numeric"
                        placeholder="e.g. 15">
                </div>
                <div class="hint">Current: <span id="percentCurrent">—</span></div>

                <label for="percentDate">Date</label>
                <input id="percentDate" type="date">
                <div class="hint">Current date: <span id="percentDateCurrent">—</span></div>

                <div class="field-error" id="percentError" hidden></div>
                <div class="btn-row"><button class="btn-lg" type="submit" id="saveBtn">Update Percent</button></div>
            </form>
        </div>
    </main>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
        import { getAuth } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
        import { getDatabase, ref, get, set, update } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBH0n84QTvGBWaSlJdO6AoUU6IRuJETHLA",
            authDomain: "ever-crest-finance-bank.firebaseapp.com",
            projectId: "ever-crest-finance-bank",
            storageBucket: "ever-crest-finance-bank.firebasestorage.app",
            messagingSenderId: "469287844559",
            appId: "1:469287844559:web:4f219675a1055533be95ba"
        };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);
        const $ = i => document.getElementById(i);
        const fullName = u => [u && u.firstName, u && u.lastName].filter(Boolean).join(' ').trim() || 'Unnamed user';
        const initials = u => (((u && u.firstName || '?')[0]) + ((u && u.lastName || '')[0] || '')).toUpperCase();

        let snackTimer;
        function toast(msg, type = 'info', ms = 5000) {
            const s = $('snack'); s.textContent = msg; s.className = 'snack ' + type;
            void s.offsetWidth; s.classList.add('show');
            clearTimeout(snackTimer); snackTimer = setTimeout(() => s.classList.remove('show'), ms);
        }

        // ---- date helpers ----
        const toInputDate = ms => {
            const d = ms ? new Date(Number(ms)) : new Date();
            if (isNaN(d)) return toInputDate(Date.now());
            const p = n => String(n).padStart(2, '0');
            return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
        };
        const fromInputDate = s => {
            const [y, m, d] = s.split('-').map(Number);
            const now = new Date();
            // chosen day, keeping the current time of day
            return new Date(y, m - 1, d, now.getHours(), now.getMinutes(), now.getSeconds()).getTime();
        };
        const prettyDate = ms => ms
            ? new Date(Number(ms)).toLocaleDateString(undefined, { day: 'numeric', month: 'short', year: 'numeric' })
            : 'Not set';

        let allUsers = [], current = null;

        const esc = s => String(s ?? '').replace(/[&<>"']/g, c =>
            ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

        (async () => {
            await auth.authStateReady();
            const user = auth.currentUser;
            if (!user) { location.replace('login.html'); return; }

            const list = $('usersList');
            try {
                const [meSnap, adminSnap, snap] = await Promise.all([
                    get(ref(db, 'users/' + user.uid)),
                    get(ref(db, 'admin/email')),
                    get(ref(db, 'users'))
                ]);
                $('avatar').textContent = initials(meSnap.exists() ? meSnap.val() : {}) || 'AD';
                const adminEmail = String(adminSnap.val() || '').toLowerCase();

                snap.forEach(child => {
                    const p = child.val() || {};
                    if (!p.email || !p.firstName) return;                      // skip orphan/partial records
                    if (String(p.email).toLowerCase() === adminEmail) return;  // skip the admin
                    allUsers.push({ uid: child.key, profile: p });
                });
                allUsers.sort((a, b) => fullName(a.profile).localeCompare(fullName(b.profile)));

                if (!allUsers.length) {
                    list.innerHTML = '<div class="empty">No users found.</div>';
                    return;
                }
                renderUsers();
            } catch (err) {
                console.error(err);
                list.innerHTML = '<div class="empty">Could not load users: ' + esc(err.message) + '</div>';
            }
        })();
        function renderUsers() {
            const list = $('usersList'); list.innerHTML = '';
            allUsers.forEach(u => {
                const a = document.createElement('a');
                a.className = 'list-item';
                a.href = 'javascript:void(0)';
                a.innerHTML = `
                    <div class="li-left">
                        <div class="avatar">${initials(u.profile)}</div>
                        <div>
                            <div class="li-name">${fullName(u.profile)}</div>
                            <div class="li-meta">Current: ${u.profile.assetPercent || '10'}% · ${prettyDate(u.profile.assetPercentUpdatedAt)}</div>
                        </div>
                    </div>
                    <div class="li-right"><span class="pill">Select</span></div>
                `;
                a.addEventListener('click', () => openForm(u.uid));
                list.appendChild(a);
            });
        }

        function openForm(uid) {
            const u = allUsers.find(x => x.uid === uid);
            if (!u) return;
            current = u;
            $('step1').hidden = true;
            $('step2').hidden = false;
            $('userTitle').textContent = fullName(u.profile);
            const cur = String(u.profile.assetPercent || '10');
            $('percentCurrent').textContent = cur + '%';
            const sel = $('percentSelect');
            const options = ['2', '5', '10', '25', '50', '100'];
            if (options.includes(cur)) { sel.value = cur; $('percentCustomWrap').hidden = true; $('percentCustom').value = ''; }
            else { sel.value = 'custom'; $('percentCustomWrap').hidden = false; $('percentCustom').value = cur; }
            $('percentDate').value = toInputDate(u.profile.assetPercentUpdatedAt);
            $('percentDateCurrent').textContent = prettyDate(u.profile.assetPercentUpdatedAt);
            $('percentError').hidden = true;
        }

        $('changeUser').addEventListener('click', () => {
            current = null;
            $('step2').hidden = true;
            $('step1').hidden = false;
            renderUsers();
        });

        $('percentSelect').addEventListener('change', () => {
            $('percentCustomWrap').hidden = $('percentSelect').value !== 'custom';
        });

        $('percentForm').addEventListener('submit', async e => {
            e.preventDefault();
            if (!current) return;
            const sel = $('percentSelect').value;
            const value = sel === 'custom' ? Number($('percentCustom').value) : Number(sel);
            const dateVal = $('percentDate').value;
            const err = $('percentError');

            if (sel === 'custom' && $('percentCustom').value.trim() === '') {
                err.textContent = 'Enter a custom percent.'; err.hidden = false; return;
            }
            if (!Number.isFinite(value) || value < 0 || value > 100) {
                err.textContent = 'Enter a valid percent between 0 and 100.'; err.hidden = false; return;
            }
            if (!dateVal) {
                err.textContent = 'Please choose a date.'; err.hidden = false; return;
            }
            err.hidden = true;

            const btn = $('saveBtn'); btn.disabled = true; btn.textContent = 'Saving…';
            try {
                const chosen = fromInputDate(dateVal);
                await update(ref(db, 'users/' + current.uid), {
                    assetPercent: value,
                    assetPercentUpdatedAt: chosen,        // the date the admin chose
                    assetPercentSavedAt: Date.now(),      // when the change was actually made (audit)
                    assetPercentUpdatedBy: auth.currentUser ? auth.currentUser.uid : 'admin'
                });
                current.profile.assetPercent = value;
                current.profile.assetPercentUpdatedAt = chosen;
                $('percentCurrent').textContent = value + '%';
                $('percentDateCurrent').textContent = prettyDate(chosen);

                // Notify the user (shows in their bell + toast), same pattern as section-b.html
                let notified = true;
                try {
                    const nid = 'pct_' + Date.now();
                    await set(ref(db, `notifications/${current.uid}/${nid}`), {
                        title: 'Investment Return Added',
                        message: 'Your investment return has been set to ' + value + '% (effective ' + prettyDate(chosen) + ').',
                        type: 'info',
                        read: false,
                        createdAt: Date.now()
                    });
                } catch (nx) {
                    notified = false;
                    console.error('Notification failed:', nx);
                }

                toast(
                    notified ? 'Percent updated and user notified.' : 'Percent updated, but the notification could not be sent.',
                    notified ? 'success' : 'error',
                    6000
                );
            } catch (ex) {
                console.error(ex);
                toast('Could not update percent. ' + (ex?.message || ''), 'error', 8000);
            } finally { btn.disabled = false; btn.textContent = 'Update Percent'; }
        });
    </script>
</body>

</html>
