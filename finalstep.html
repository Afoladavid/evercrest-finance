<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>You are all set | EverCrest Finance</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
    <style>
        :root {
            box-sizing: border-box;
            padding-top: env(safe-area-inset-top, 0px);
            padding-bottom: env(safe-area-inset-bottom, 0px);
            --bg: #fff;
            --ink: #0b2340;
            --soft: #6b7c90;
            --line: #e3e9f0;
            --gold: #ffc93c;
            --ok: #12a06b;
            --bad: #d64535;
        }

        *,
        *::before,
        *::after {
            box-sizing: inherit
        }

        html {
            height: 100%;
            scroll-padding-top: env(safe-area-inset-top, 0px);
            -webkit-text-size-adjust: 100%
        }

        body {
            margin: 0;
            min-height: 100%;
            background: var(--bg);
            color: var(--ink);
            font: 15px/1.5 "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif
        }

        .page {
            max-width: 420px;
            margin: 0 auto;
            padding: 24px 22px 32px;
            min-height: 100dvh;
            display: flex;
            flex-direction: column
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 800;
            font-size: 1.02rem;
            letter-spacing: -.01em
        }

        .logo {
            width: 34px;
            height: 34px;
            border-radius: 10px;
            background: var(--ink);
            display: grid;
            place-items: center
        }

        .logo svg {
            width: 20px;
            height: 20px
        }

        .steps {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
            margin: 32px 0 8px
        }

        .steps b {
            height: 5px;
            border-radius: 9px;
            background: var(--gold)
        }

        .count {
            font-size: .85rem;
            color: var(--soft);
            margin: 0
        }

        .done {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            text-align: center;
            padding: 24px 0
        }

        .big {
            width: 84px;
            height: 84px;
            margin: 0 auto 22px;
            border-radius: 50%;
            background: var(--ok);
            display: grid;
            place-items: center;
            color: #fff;
            animation: pop .5s cubic-bezier(.3, 1.6, .5, 1)
        }

        .big svg {
            width: 40px;
            height: 40px
        }

        h1 {
            font-size: 1.9rem;
            line-height: 1.15;
            letter-spacing: -.03em;
            margin: 0 0 10px;
            font-weight: 800
        }

        .lead {
            color: var(--soft);
            margin: 0 0 28px;
            font-size: .95rem
        }

        .btn {
            width: 100%;
            height: 54px;
            border: 0;
            border-radius: 999px;
            background: var(--gold);
            color: var(--ink);
            font: inherit;
            font-size: 1.05rem;
            font-weight: 800;
            cursor: pointer;
            transition: transform .15s, filter .2s
        }

        .btn:hover {
            filter: brightness(1.05)
        }

        .btn:active {
            transform: scale(.98)
        }

        .btn:focus-visible {
            outline: 3px solid var(--ink);
            outline-offset: 3px
        }

        .btn:disabled {
            opacity: .7;
            cursor: progress
        }

        @keyframes pop {
            from {
                transform: scale(.4);
                opacity: 0
            }
        }

        .sr {
            position: absolute;
            width: 1px;
            height: 1px;
            overflow: hidden;
            clip: rect(0 0 0 0)
        }

        .snack {
            position: fixed;
            top: calc(env(safe-area-inset-top, 0px) + 12px);
            left: 50%;
            z-index: 99;
            width: min(92vw, 460px);
            padding: 13px 16px;
            border-radius: 12px;
            color: #fff;
            font-weight: 600;
            font-size: .9rem;
            background: var(--ink);
            transform: translate(-50%, -160%);
            opacity: 0;
            transition: transform .35s cubic-bezier(.2, .8, .2, 1), opacity .3s;
            pointer-events: none
        }

        .snack.show {
            transform: translate(-50%, 0);
            opacity: 1
        }

        .snack.success {
            background: var(--ok)
        }

        .snack.error {
            background: var(--bad)
        }

        @media (min-width:600px) {
            .page {
                padding-top: 56px
            }
        }

        @media (prefers-reduced-motion:reduce) {
            * {
                transition: none !important;
                animation: none !important
            }
        }
    </style>
</head>

<body>
    <div class="snack" id="snack" role="status" aria-live="polite"></div>
    <svg class="sr" aria-hidden="true">
        <symbol id="i-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="m5 12.5 4.5 4.5L19 7.5" />
        </symbol>
    </svg>

    <div class="page">
        <div class="brand">
            <span class="logo" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="#ffc93c"
                    stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 18 9 8l4 6 3-4 5 8" />
                </svg></span>
            <span>EverCrest Finance</span>
        </div>

        <div class="steps" aria-hidden="true"><b></b><b></b><b></b><b></b></div>
        <p class="count">All steps complete</p>

        <main class="done" id="doneView">
            <div class="big"><svg aria-hidden="true">
                    <use href="#i-check" />
                </svg></div>
            <h1>You are all set</h1>
            <p class="lead" id="doneMsg">Your Ever Crest account is ready. Head to your dashboard to start saving and
                investing.</p>
            <button class="btn" type="button" id="goBtn">Go to dashboard</button>
        </main>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
        import { getAuth } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
        import { getDatabase, ref, get, update, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBH0n84QTvGBWaSlJdO6AoUU6IRuJETHLA",
            authDomain: "ever-crest-finance-bank.firebaseapp.com",
            databaseURL: "https://ever-crest-finance-bank-default-rtdb.firebaseio.com",
            projectId: "ever-crest-finance-bank",
            storageBucket: "ever-crest-finance-bank.firebasestorage.app",
            messagingSenderId: "469287844559",
            appId: "1:469287844559:web:4f219675a1055533be95ba"
        };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);

        const ROUTES = { 1: 'personal.html', 2: 'address.html', 3: 'finalstep.html', 4: 'dashboard.html' };
        const $ = i => document.getElementById(i);
        let snackTimer;
        function toast(msg, type = 'info', ms = 5000) {
            const s = $('snack');
            s.textContent = msg;
            s.className = 'snack ' + type;
            void s.offsetWidth;
            s.classList.add('show');
            clearTimeout(snackTimer);
            snackTimer = setTimeout(() => s.classList.remove('show'), ms);
        }

        function showError(err) {
            const c = (err && err.code) || '';
            console.error('Error:', c, err && err.message);
            if (c === 'auth/network-request-failed' || c === 'unavailable') return toast('No internet connection. Check your network and try again.', 'error', 8000);
            if (c === 'db-timeout') return toast('The database did not respond. Please try again.', 'error', 8000);
            if (c === 'PERMISSION_DENIED' || /permission/i.test((err && err.message) || '')) return toast('Saving was blocked by your Realtime Database rules.', 'error', 8000);
            toast('Something went wrong (' + (c || (err && err.message) || 'unknown') + '). Please try again.', 'error', 8000);
        }

        let user = null, saved = null, allowed = false;
        // The button is now active immediately. A click waits for this check to finish.
        const ready = (async () => {
            await auth.authStateReady();
            user = auth.currentUser;
            if (!user) { location.replace('login.html'); return; }
            try {
                const msg = sessionStorage.getItem('ec_flash');
                if (msg) { sessionStorage.removeItem('ec_flash'); toast(msg, 'success', 5000); }
            } catch (_) { }
            try {
                const snap = await get(ref(db, 'users/' + user.uid));
                saved = snap.exists() ? snap.val() : null;
            } catch (e) { showError(e); return; }
            const step = Number(saved && saved.step) || 1;
            if (step < 3) { location.replace(ROUTES[Math.max(1, step)]); return; }
            if (step >= 4) { location.replace(ROUTES[4]); return; }
            if (saved.firstName) $('doneMsg').textContent = 'Welcome, ' + saved.firstName + '. Your Ever Crest account is ready. Head to your dashboard to start saving and investing.';
            allowed = true;
        })();

        $('goBtn').addEventListener('click', async () => {
            const b = $('goBtn');
            if (b.disabled) return;
            b.disabled = true; b.textContent = 'Opening dashboard…';
            try {
                await ready;
                if (!user || !allowed) return;
                await Promise.race([
                    update(ref(db, 'users/' + user.uid), { step: Math.max(4, Number(saved && saved.step) || 0), completedAt: serverTimestamp(), updatedAt: serverTimestamp() }),
                    new Promise((_, rej) => setTimeout(() => rej({ code: 'db-timeout' }), 10000))
                ]);
                b.dataset.go = '1';
                location.replace('dashboard.html');
            } catch (err) {
                showError(err);
            } finally {
                if (!b.dataset.go) { b.disabled = false; b.textContent = 'Go to dashboard'; }
            }
        });
    </script>
</body>

</html>
