<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>EverCrest Finance </title>
    <noscript><meta http-equiv="refresh" content="5; url=login.html"></noscript>
    <style>
        :root {
            --bg: #f5f7fb;
            --ink: #0b2340;
            --soft: #5b6f86;
            --gold: #ffc93c;
            --line: #d5dee8
        }

        html,
        body {
            height: 100%;
            margin: 0
        }

        body {
            display: grid;
            place-items: center;
            background: var(--bg);
            color: var(--ink);
            font: 15px/1.5 "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            text-align: center
        }

        .brand {
            font-weight: 800;
            font-size: clamp(1.5rem, 6vw, 2.2rem);
            letter-spacing: -.02em
        }

        .brand i {
            font-style: normal;
            color: #e0a800
        }

        .load {
            margin-top: 10px;
            color: var(--soft);
            font-weight: 600
        }

        .spin {
            width: 34px;
            height: 34px;
            margin: 18px auto 0;
            border: 4px solid var(--line);
            border-top-color: var(--gold);
            border-radius: 50%;
            animation: s 1s linear infinite
        }

        @keyframes s {
            to {
                transform: rotate(360deg)
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .spin {
                animation: none
            }
        }
    </style>
</head>

<body>
    <div>
        <div class="brand"><i>EverCrest</i> Finance </div>
        <div class="spin" aria-hidden="true"></div>
        <div class="load" role="status">Loading…</div>
    </div>

    <script>
        // After 5 seconds, always go to the login page
        setTimeout(function () { location.replace('login.html'); }, 5000);
    </script>
</body>

</html>
