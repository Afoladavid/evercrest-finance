<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Ever Crest Finance</title>
    <noscript><meta http-equiv="refresh" content="5; url=login.html"></noscript>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
    <style>
        :root {
            box-sizing: border-box;
            padding-top: env(safe-area-inset-top, 0px);
            padding-bottom: env(safe-area-inset-bottom, 0px);
            --bg: #fff;
            --ink: #0b2340;
            --soft: #6b7c90;
            --line: #e3e9f0;
            --gold: #ffc93c
        }

        *,
        *::before,
        *::after {
            box-sizing: inherit
        }

        html {
            height: 100%;
            -webkit-text-size-adjust: 100%
        }

        body {
            margin: 0;
            min-height: 100%;
            background: var(--bg);
            color: var(--ink);
            font: 15px/1.5 "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif
        }

        .page {
            max-width: 420px;
            margin: 0 auto;
            padding: 24px 22px 32px;
            min-height: 100dvh;
            display: flex;
            flex-direction: column
        }

        .center {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 22px;
            text-align: center
        }

        .mark {
            position: relative;
            width: 96px;
            height: 96px;
            display: grid;
            place-items: center
        }

        .logo {
            width: 64px;
            height: 64px;
            border-radius: 18px;
            background: var(--ink);
            display: grid;
            place-items: center;
            animation: pulse 1.6s ease-in-out infinite
        }

        .logo svg {
            width: 34px;
            height: 34px
        }

        .spin {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            border: 3px solid var(--line);
            border-top-color: var(--gold);
            animation: s 1s linear infinite
        }

        .brand {
            font-weight: 800;
            font-size: 1.9rem;
            line-height: 1.15;
            letter-spacing: -.03em
        }

        .load {
            margin-top: -14px;
            color: var(--soft);
            font-size: .95rem
        }

        .foot {
            text-align: center;
            font-size: .9rem;
            color: var(--soft)
        }

        .foot a {
            color: var(--ink);
            font-weight: 700
        }

        a:focus-visible {
            outline: 3px solid var(--ink);
            outline-offset: 3px
        }

        @keyframes s {
            to {
                transform: rotate(360deg)
            }
        }

        @keyframes pulse {
            50% {
                transform: scale(.93)
            }
        }

        @media (prefers-reduced-motion: reduce) {
            * {
                animation: none !important;
                transition: none !important
            }
        }
    </style>
</head>

<body>
    <div class="page">
        <div class="center">
            <div class="mark">
                <span class="spin" aria-hidden="true"></span>
                <span class="logo" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="#ffc93c"
                        stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M3 18 9 8l4 6 3-4 5 8" />
                    </svg></span>
            </div>
            <div class="brand">Ever Crest Finance</div>
            <div class="load" role="status">Loading…</div>
        </div>
        <div class="foot">Not redirected? <a href="login.html">Go to login</a></div>
    </div>

    <script>
        // After 5 seconds, always go to the login page
        setTimeout(function () { location.replace('login.html'); }, 5000);
    </script>
</body>

</html>
